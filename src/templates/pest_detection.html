<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pest Detection - Smart Agriculture</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f7fa; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .navbar h1 { font-size: 24px; }
        .navbar a { color: white; text-decoration: none; margin-left: 20px; padding: 8px 15px; border-radius: 5px; transition: all 0.3s; }
        .navbar a:hover { background: rgba(255,255,255,0.2); }
        .container { max-width: 800px; margin: 30px auto; padding: 0 20px; }
        .form-card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 30px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; color: #333; margin-bottom: 5px; font-weight: 600; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 5px; font-size: 14px; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #667eea; }
        .btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 12px 30px; border: none; border-radius: 5px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4); }
        .results { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: none; }
        .pest-result { padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .pest-result.high { background: #fee2e2; border-left: 5px solid #ef4444; }
        .pest-result.medium { background: #fef3c7; border-left: 5px solid #f59e0b; }
        .pest-result.low { background: #d1f2eb; border-left: 5px solid #10b981; }
        .pest-name { font-size: 24px; font-weight: bold; margin-bottom: 10px; }
        .risk-level { display: inline-block; padding: 5px 15px; border-radius: 20px; font-weight: 600; color: white; margin-bottom: 15px; }
        .risk-high { background: #ef4444; }
        .risk-medium { background: #f59e0b; }
        .risk-low { background: #10b981; }
        .recommendations { margin-top: 15px; }
        .recommendations h4 { color: #333; margin-bottom: 10px; }
        .recommendations ul { padding-left: 20px; }
        .recommendations li { margin-bottom: 8px; line-height: 1.5; }
        .confidence-bar { background: #e0e0e0; height: 10px; border-radius: 5px; margin: 10px 0; }
        .confidence-fill { height: 100%; border-radius: 5px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .loading { display: none; text-align: center; padding: 20px; }
        .spinner { display: inline-block; width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #667eea; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>🐛 Pest Detection</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/dashboard">Dashboard</a>
            <a href="/analysis">Analysis</a>
            <a href="/market-prediction-page">Market</a>
        </nav>
    </div>
    
    <div class="container">
        <div class="form-card">
            <h2>Pest Detection Analysis</h2>
            <p>Analyze environmental conditions to detect potential pest threats</p>
            
            <form id="pestForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Temperature (°C)</label>
                        <input type="number" name="temperature" value="25" required>
                    </div>
                    <div class="form-group">
                        <label>Humidity (%)</label>
                        <input type="number" name="humidity" value="75" required>
                    </div>
                    <div class="form-group">
                        <label>Rainfall (mm)</label>
                        <input type="number" name="rainfall_mm" value="15" required>
                    </div>
                    <div class="form-group">
                        <label>Crop Type</label>
                        <select name="crop" required>
                            <option value="wheat">Wheat</option>
                            <option value="rice">Rice</option>
                            <option value="corn">Corn</option>
                            <option value="cotton">Cotton</option>
                            <option value="soybean">Soybean</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Growth Stage</label>
                        <select name="growth_stage" required>
                            <option value="seedling">Seedling</option>
                            <option value="vegetative">Vegetative</option>
                            <option value="flowering">Flowering</option>
                            <option value="maturity">Maturity</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Soil Moisture (%)</label>
                        <input type="number" name="soil_moisture" value="60" required>
                    </div>
                </div>
                <button type="submit" class="btn">Detect Pests</button>
            </form>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Analyzing pest conditions...</p>
        </div>
        
        <div class="results" id="results">
            <h2>Pest Detection Results</h2>
            <div id="resultsContent"></div>
        </div>
    </div>
    
    <script>
        document.getElementById('pestForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').style.display = 'none';
            
            try {
                const response = await fetch('/api/pest-detection', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    displayResults(result.detection);
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('Network error: ' + error.message);
            }
            
            document.getElementById('loading').style.display = 'none';
        });
        
        function displayResults(detection) {
            const container = document.getElementById('resultsContent');
            
            const riskClass = detection.risk_level.toLowerCase();
            
            container.innerHTML = `
                <div class="pest-result ${riskClass}">
                    <div class="pest-name">${detection.predicted_pest.replace('_', ' ').toUpperCase()}</div>
                    <span class="risk-level risk-${riskClass}">${detection.risk_level} RISK</span>
                    
                    <div style="margin: 15px 0;">
                        <strong>Confidence Level: ${(detection.confidence * 100).toFixed(1)}%</strong>
                        <div class="confidence-bar">
                            <div class="confidence-fill" style="width: ${detection.confidence * 100}%"></div>
                        </div>
                    </div>
                    
                    <div style="margin: 15px 0;">
                        <strong>Severity Score: ${(detection.severity_score * 100).toFixed(1)}%</strong>
                        <div class="confidence-bar">
                            <div class="confidence-fill" style="width: ${detection.severity_score * 100}%"></div>
                        </div>
                    </div>
                    
                    <div class="recommendations">
                        <h4>🔧 Recommended Actions:</h4>
                        <ul>
                            ${detection.recommendations.map(rec => `<li>${rec}</li>`).join('')}
                        </ul>
                    </div>
                </div>
            `;
            
            document.getElementById('results').style.display = 'block';
        }
    </script>
</body>
</html>
