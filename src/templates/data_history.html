<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data History - Smart Agriculture</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f7fa; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .navbar h1 { font-size: 24px; }
        .navbar a { color: white; text-decoration: none; margin-left: 20px; padding: 8px 15px; border-radius: 5px; transition: all 0.3s; }
        .navbar a:hover { background: rgba(255,255,255,0.2); }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .controls { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 30px; display: flex; gap: 20px; align-items: center; }
        .controls select, .controls button { padding: 10px 15px; border: 2px solid #e0e0e0; border-radius: 5px; font-size: 14px; }
        .controls button { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; cursor: pointer; font-weight: 600; }
        .controls button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4); }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; border-left: 5px solid #667eea; }
        .stat-value { font-size: 28px; font-weight: bold; color: #667eea; margin-bottom: 5px; }
        .stat-label { color: #999; font-size: 14px; font-weight: 600; text-transform: uppercase; }
        .data-section { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 30px; }
        .data-section h3 { color: #667eea; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .record-card { background: #f8f9ff; padding: 20px; border-radius: 8px; border-left: 4px solid #667eea; margin-bottom: 15px; }
        .record-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .record-id { font-weight: 600; color: #333; }
        .record-time { color: #999; font-size: 12px; }
        .record-content { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .record-item { background: white; padding: 12px; border-radius: 5px; }
        .record-item .label { color: #999; font-size: 11px; text-transform: uppercase; margin-bottom: 5px; }
        .record-item .value { color: #333; font-weight: 600; }
        .loading { display: none; text-align: center; padding: 40px; }
        .spinner { display: inline-block; width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #667eea; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .no-data { text-align: center; padding: 40px; color: #999; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-high { background: #fee2e2; color: #ef4444; }
        .badge-medium { background: #fef3c7; color: #f59e0b; }
        .badge-low { background: #d1f2eb; color: #10b981; }
        .badge-bullish { background: #d1f2eb; color: #10b981; }
        .badge-bearish { background: #fee2e2; color: #ef4444; }
        .badge-stable { background: #e0f2fe; color: #0ea5e9; }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>📚 Data History</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/dashboard">Dashboard</a>
            <a href="/performance-page">Performance</a>
        </nav>
    </div>
    
    <div class="container">
        <div class="controls">
            <label>Data Type:</label>
            <select id="dataType">
                <option value="all">All Data</option>
                <option value="analyses">Comprehensive Analyses</option>
                <option value="pest">Pest Detections</option>
                <option value="market">Market Predictions</option>
            </select>
            
            <label>Records:</label>
            <select id="recordLimit">
                <option value="10">10 Records</option>
                <option value="25">25 Records</option>
                <option value="50">50 Records</option>
                <option value="100">100 Records</option>
            </select>
            
            <button onclick="loadData()">🔄 Refresh Data</button>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Loading historical data...</p>
        </div>
        
        <div id="statsSection" style="display: none;">
            <div class="stats-grid" id="statsGrid">
                <!-- Stats will be populated here -->
            </div>
        </div>
        
        <div id="dataContent">
            <!-- Data will be populated here -->
        </div>
    </div>
    
    <script>
        async function loadData() {
            const dataType = document.getElementById('dataType').value;
            const limit = document.getElementById('recordLimit').value;
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('dataContent').innerHTML = '';
            document.getElementById('statsSection').style.display = 'none';
            
            try {
                const response = await fetch(`/api/data-history?type=${dataType}&limit=${limit}`);
                const result = await response.json();
                
                if (result.status === 'success') {
                    displayData(result.history, result.total_records);
                } else {
                    document.getElementById('dataContent').innerHTML = 
                        '<div class="no-data">❌ Error loading data: ' + (result.message || 'Unknown error') + '</div>';
                }
            } catch (error) {
                console.error('Data loading error:', error);
                document.getElementById('dataContent').innerHTML = 
                    '<div class="no-data">🔌 Network error. Check if MongoDB is running.</div>';
            }
            
            document.getElementById('loading').style.display = 'none';
        }
        
        function displayData(history, totalRecords) {
            // Display stats
            const statsGrid = document.getElementById('statsGrid');
            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${totalRecords}</div>
                    <div class="stat-label">Total Records</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${history.analyses ? history.analyses.length : 0}</div>
                    <div class="stat-label">Analyses</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${history.pest_detections ? history.pest_detections.length : 0}</div>
                    <div class="stat-label">Pest Detections</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${history.market_predictions ? history.market_predictions.length : 0}</div>
                    <div class="stat-label">Market Predictions</div>
                </div>
            `;
            document.getElementById('statsSection').style.display = 'block';
            
            const container = document.getElementById('dataContent');
            let content = '';
            
            if (totalRecords === 0) {
                content = '<div class="no-data">📭 No data found. Try running some analyses first!</div>';
            } else {
                // Comprehensive Analyses
                if (history.analyses && history.analyses.length > 0) {
                    content += `
                        <div class="data-section">
                            <h3>🔬 Comprehensive Analyses <span>(${history.analyses.length})</span></h3>
                            ${history.analyses.map(analysis => `
                                <div class="record-card">
                                    <div class="record-header">
                                        <div class="record-id">${analysis.analysis_id}</div>
                                        <div class="record-time">${new Date(analysis.timestamp).toLocaleString()}</div>
                                    </div>
                                    <div class="record-content">
                                        <div class="record-item">
                                            <div class="label">Crop</div>
                                            <div class="value">${analysis.input_conditions?.crop || 'N/A'}</div>
                                        </div>
                                        <div class="record-item">
                                            <div class="label">Predicted Yield</div>
                                            <div class="value">${analysis.predictions?.yield?.predicted_yield || 'N/A'} kg/ha</div>
                                        </div>
                                        <div class="record-item">
                                            <div class="label">Market Price</div>
                                            <div class="value">₹${analysis.predictions?.market_price?.predicted_price || 'N/A'}</div>
                                        </div>
                                        <div class="record-item">
                                            <div class="label">Pest Risk</div>
                                            <div class="value">
                                                <span class="badge badge-${(analysis.risk_assessment?.pests?.risk_level || 'medium').toLowerCase()}">${analysis.risk_assessment?.pests?.risk_level || 'N/A'}</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }
                
                // Pest Detections
                if (history.pest_detections && history.pest_detections.length > 0) {
                    content += `
                        <div class="data-section">
                            <h3>🐛 Pest Detections <span>(${history.pest_detections.length})</span></h3>
                            ${history.pest_detections.map(pest => `
                                <div class="record-card">
                                    <div class="record-header">
                                        <div class="record-id">${pest.detection_id}</div>
                                        <div class="record-time">${new Date(pest.timestamp).toLocaleString()}</div>
                                    </div>
                                    <div class="record-content">
                                        <div class="record-item">
                                            <div class="label">Predicted Pest</div>
                                            <div class="value">${pest.predicted_pest.replace('_', ' ').toUpperCase()}</div>
                                        </div>
                                        <div class="record-item">
                                            <div class="label">Risk Level</div>
                                            <div class="value">
                                                <span class="badge badge-${pest.risk_level.toLowerCase()}">${pest.risk_level}</span>
                                            </div>
                                        </div>
                                        <div class="record-item">
                                            <div class="label">Confidence</div>
                                            <div class="value">${(pest.confidence * 100).toFixed(1)}%</div>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }
                
                // Market Predictions
                if (history.market_predictions && history.market_predictions.length > 0) {
                    content += `
                        <div class="data-section">
                            <h3>💰 Market Predictions <span>(${history.market_predictions.length})</span></h3>
                            ${history.market_predictions.map(market => `
                                <div class="record-card">
                                    <div class="record-header">
                                        <div class="record-id">${market.prediction_id}</div>
                                        <div class="record-time">${new Date(market.timestamp).toLocaleString()}</div>
                                    </div>
                                    <div class="record-content">
                                        <div class="record-item">
                                            <div class="label">Predicted Price</div>
                                            <div class="value">${market.currency} ${market.predicted_price.toLocaleString()}</div>
                                        </div>
                                        <div class="record-item">
                                            <div class="label">Market Outlook</div>
                                            <div class="value">
                                                <span class="badge badge-${market.market_analysis?.outlook.toLowerCase()}">${market.market_analysis?.outlook}</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }
            }
            
            container.innerHTML = content;
        }
        
        // Load data on page load
        window.addEventListener('load', loadData);
    </script>
</body>
</html>
